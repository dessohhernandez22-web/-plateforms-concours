name: Contest lifecycle

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: contest-lifecycle
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync contest lifecycle
        env:
          APP_URL: https://plateforms-concours.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/contest-lifecycle"